[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openarch-swept-paths"
version = "0.1.0"
description = "Standalone Australian vehicle swept path analysis for CAD drawings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "ezdxf>=1.3",
    "shapely>=2.0",
]

[project.scripts]
openarchsp = "openarchsp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openarchsp = ["assets/*.svg", "assets/icons/*.svg"]


